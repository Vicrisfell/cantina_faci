name: Gerar APK Android (Cantina Facil)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cantina_mobile/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cantina_mobile

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK de Release
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: cantina-facil-android-apk
          path: cantina_mobile/build/app/outputs/flutter-apk/app-release.apk
